<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Background -->
  <rect width="40" height="40" rx="10" fill="#0B0F19" />
  <rect x="1" y="1" width="38" height="38" rx="9" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Connecting UML Relation Lines -->
  <path d="M14 16 L26 16 L26 26 L14 26 Z" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="2 2" />
  <path d="M12 18 L28 24" stroke="#818CF8" stroke-width="2" />
  
  <!-- Top Left UML Class Box -->
  <rect x="6" y="8" width="13" height="11" rx="2.5" fill="url(#bgGrad)" stroke="#60A5FA" stroke-width="1.5" />
  <line x1="6" y1="12" x2="19" y2="12" stroke="#93C5FD" stroke-width="1" />
  
  <!-- Bottom Right UML Class Box -->
  <rect x="21" y="21" width="13" height="11" rx="2.5" fill="url(#nodeGrad)" stroke="#A5B4FC" stroke-width="1.5" />
  <line x1="21" y1="25" x2="34" y2="25" stroke="#C7D2FE" stroke-width="1" />
  
  <!-- Small Diamonds / Cardinality nodes -->
  <polygon points="26,16 28,14 30,16 28,18" fill="#38BDF8" />
  <circle cx="14" cy="26" r="1.5" fill="#38BDF8" />
</svg>
